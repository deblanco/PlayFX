# The project's site (apps/site) on GitHub Pages: https://deblanco.github.io/PlayFX/. Built and deployed when it
# changes on main, or by hand. It holds no keys: the release signing stays on the owner's Mac (scripts/release.sh).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - apps/desktop/src-tauri/icons/128x128@2x.png
      - .github/workflows/pages.yml
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Third-party: pinned to a commit, so a moved tag can't change what runs here.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build the site
        run: bun run --cwd apps/site build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
