# The project's site (apps/site) on GitHub Pages: https://deblanco.github.io/PlayFX/. Built and deployed when it
# changes on main, or by hand. It holds no keys: the release signing stays on the owner's Mac (scripts/release.sh).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - apps/desktop/src-tauri/icons/128x128@2x.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build the site
        run: bun run --cwd apps/site build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
