# Build and check all three languages on every push and pull request. Each package keeps line and
# function coverage at or above 80% (CLAUDE.md); the coverage commands fail below that.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Our own Remote Play protocol package (no Homebrew dependencies), so it runs first.
      - name: PlayFXProtocol tests and coverage
        run: packages/playfxprotocol/scripts/coverage.sh --no-parallel

      # StreamCore links Homebrew's static libopus (Package.swift, build.rs).
      - name: Homebrew dependencies
        run: brew install opus

      # One test at a time: on a runner the log then names the test that fails or crashes.
      - name: Swift tests and coverage
        run: packages/streamcore/scripts/coverage.sh --no-parallel

      - name: Crash reports
        if: failure()
        run: |
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            [ -f "$f" ] || continue
            echo "== $f"
            python3 - "$f" <<'PY'
          import json, sys
          lines = open(sys.argv[1]).read().split("\n", 1)
          report = json.loads(lines[1])
          print(report.get("exception"), report.get("termination", {}).get("indicator"))
          images = report.get("usedImages", [])
          thread = report["threads"][report.get("faultingThread", 0)]
          for frame in thread["frames"][:30]:
              image = images[frame["imageIndex"]].get("name", "?") if frame.get("imageIndex") is not None else "?"
              print(f'  {image:32} {frame.get("symbol", hex(frame.get("imageOffset", 0)))}')
          PY
          done

      - uses: oven-sh/setup-bun@v2

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript (tsc, ESLint, vitest + coverage)
        run: bun run --cwd apps/desktop check

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, clippy

      - uses: taiki-e/install-action@cargo-llvm-cov

      # Tauri embeds the built web UI, so the Rust crate needs it to compile.
      - name: Build the web UI
        run: bun run --cwd apps/desktop build

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests and coverage
        run: bun run --cwd apps/desktop coverage:rust
